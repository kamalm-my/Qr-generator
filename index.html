<!-- QR Kod Kamalm V1.0 — Divi Code Module Version -->
<!-- PASTE SEMUA KOD NI DALAM SATU DIVI CODE MODULE -->

<div class="qr-kamalm-wrapper">
    <div class="qr-card">
        <div class="qr-card-header">
            <h2 class="qr-title">QR Kod Kamalm V1.0</h2>
            <p class="qr-subtitle">Jana Kod QR Pantas &amp; Mudah</p>
        </div>
        <div class="qr-card-body">
            <div class="qr-input-group">
                <label class="qr-label" for="qr-input-field">Masukkan Teks atau URL Web:</label>
                <input type="text" id="qr-input-field" class="qr-text-input" placeholder="Contoh: https://www.utm.my" autocomplete="off">
                <div id="qr-error-msg" class="qr-error" style="display:none;">Sila masukkan teks atau URL untuk meneruskan.</div>
            </div>
            <div class="qr-input-group">
                <label class="qr-label">Muat Naik Logo (Pilihan):</label>
                <label class="qr-file-label" for="qr-logo-input">Pilih Imej Logo Anda</label>
                <input type="file" id="qr-logo-input" accept="image/png,image/jpeg,image/webp" style="display:none;">
                <div id="qr-logo-preview-box" style="display:none; align-items:center; justify-content:space-between; margin-top:12px; padding:12px; border:1px solid #ddd; border-radius:6px;">
                    <img id="qr-logo-preview" src="" alt="Logo" style="max-height:45px; max-width:120px; object-fit:contain;">
                    <button id="qr-clear-logo" class="qr-btn-clear" type="button">Padam Logo</button>
                </div>
            </div>
            <button id="qr-generate-btn" class="qr-btn-generate" type="button">Jana Kod QR</button>
            <div class="qr-output-area">
                <div id="qr-code-container" class="qr-box">
                    <span id="qr-placeholder" class="qr-placeholder-text">Kod QR anda akan dipaparkan di sini.</span>
                </div>
                <button id="qr-download-btn" class="qr-btn-download" type="button" style="display:none;">Muat Turun Imej</button>
            </div>
        </div>
    </div>
</div>

<style>
.qr-kamalm-wrapper { width:100%; display:flex; justify-content:center; align-items:center; padding:40px 15px; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; box-sizing:border-box; }
.qr-kamalm-wrapper *, .qr-kamalm-wrapper *::before, .qr-kamalm-wrapper *::after { box-sizing:border-box; }
.qr-card { background:#fff; width:100%; max-width:500px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.1); overflow:hidden; border-top:6px solid #800000; }
.qr-card-header { padding:25px 20px; text-align:center; border-bottom:2px solid #FFCC00; }
.qr-title { color:#800000 !important; font-size:1.6rem !important; font-weight:bold !important; margin:0 0 5px 0 !important; padding:0 !important; line-height:1.3 !important; }
.qr-subtitle { color:#666 !important; font-size:0.95rem !important; margin:0 !important; padding:0 !important; }
.qr-card-body { padding:30px 25px; }
.qr-input-group { margin-bottom:20px; }
.qr-label { display:block; margin-bottom:8px; color:#333; font-weight:600; font-size:0.95rem; }
.qr-text-input { width:100%; padding:12px 15px; border:1px solid #ddd; border-radius:6px; font-size:1rem; background:#fff; color:#333; outline:none; transition:border-color .3s, box-shadow .3s; }
.qr-text-input:focus { border-color:#800000; box-shadow:0 0 0 3px rgba(128,0,0,.1); }
.qr-error { color:#d9534f; font-size:0.85rem; margin-top:8px; }
.qr-file-label { display:block; width:100%; padding:15px; text-align:center; border:2px dashed #ddd; border-radius:6px; background:#fafafa; color:#555; font-size:0.95rem; font-weight:500; cursor:pointer; transition:border-color .3s, color .3s; }
.qr-file-label:hover { border-color:#800000; color:#800000; background:rgba(128,0,0,.02); }
.qr-btn-clear { background:#f8d7da; color:#721c24; border:none; padding:8px 12px; border-radius:4px; cursor:pointer; font-size:0.85rem; font-weight:600; }
.qr-btn-clear:hover { background:#f5c6cb; }
.qr-btn-generate { width:100%; padding:14px; background:#800000; color:#fff; border:none; border-radius:6px; font-size:1.1rem; font-weight:bold; cursor:pointer; margin-top:10px; transition:background .3s; }
.qr-btn-generate:hover { background:#5a0000; }
.qr-output-area { margin-top:30px; display:flex; flex-direction:column; align-items:center; }
.qr-box { padding:20px; background:#fff; border:2px dashed #ddd; border-radius:8px; min-height:240px; min-width:240px; display:flex; align-items:center; justify-content:center; }
.qr-placeholder-text { color:#999; font-size:0.95rem; text-align:center; }
.qr-btn-download { margin-top:20px; padding:12px 24px; background:#FFCC00; color:#333; border:none; border-radius:6px; font-size:1rem; font-weight:bold; cursor:pointer; transition:background .3s; }
.qr-btn-download:hover { background:#e6b800; }
</style>

<script>
(function() {
    function loadQRLibAndInit() {
        if (typeof QRCode !== 'undefined') {
            initQRTool();
            return;
        }
        var script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
        script.onload = function() { initQRTool(); };
        script.onerror = function() { alert('Gagal memuatkan pustaka QR. Sila semak sambungan internet.'); };
        document.head.appendChild(script);
    }

    function initQRTool() {
        var inputField    = document.getElementById('qr-input-field');
        var generateBtn   = document.getElementById('qr-generate-btn');
        var container     = document.getElementById('qr-code-container');
        var errorMsg      = document.getElementById('qr-error-msg');
        var placeholder   = document.getElementById('qr-placeholder');
        var downloadBtn   = document.getElementById('qr-download-btn');
        var logoInput     = document.getElementById('qr-logo-input');
        var logoPreviewBox= document.getElementById('qr-logo-preview-box');
        var logoPreview   = document.getElementById('qr-logo-preview');
        var clearLogoBtn  = document.getElementById('qr-clear-logo');
        var logoBase64    = null;

        if (!inputField) return;

        logoInput.addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                logoBase64 = ev.target.result;
                logoPreview.src = logoBase64;
                logoPreviewBox.style.display = 'flex';
            };
            reader.readAsDataURL(file);
        });

        clearLogoBtn.addEventListener('click', function() {
            logoInput.value = '';
            logoBase64 = null;
            logoPreview.src = '';
            logoPreviewBox.style.display = 'none';
        });

        function generateQR() {
            var text = inputField.value.trim();
            errorMsg.style.display = 'none';
            downloadBtn.style.display = 'none';

            if (!text) {
                errorMsg.style.display = 'block';
                container.innerHTML = '';
                container.appendChild(placeholder);
                return;
            }

            container.innerHTML = '';

            new QRCode(container, {
                text: text,
                width: 200,
                height: 200,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(function() {
                var canvas = container.querySelector('canvas');
                var imgEl  = container.querySelector('img');

                if (canvas && logoBase64) {
                    var ctx = canvas.getContext('2d');
                    var img = new Image();
                    img.src = logoBase64;
                    img.onload = function() {
                        var size = canvas.width * 0.25;
                        var x = (canvas.width - size) / 2;
                        var y = (canvas.height - size) / 2;
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(x - 5, y - 5, size + 10, size + 10);
                        ctx.drawImage(img, x, y, size, size);
                        if (imgEl) imgEl.src = canvas.toDataURL('image/png');
                        downloadBtn.style.display = 'inline-block';
                    };
                } else {
                    downloadBtn.style.display = 'inline-block';
                }
            }, 100);
        }

        generateBtn.addEventListener('click', generateQR);
        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generateQR();
        });

        downloadBtn.addEventListener('click', function() {
            var canvas = container.querySelector('canvas');
            if (!canvas) return;
            var border = 30;
            var finalCanvas = document.createElement('canvas');
            finalCanvas.width  = canvas.width  + border * 2;
            finalCanvas.height = canvas.height + border * 2;
            var ctx = finalCanvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
            ctx.drawImage(canvas, border, border);
            var a = document.createElement('a');
            a.href = finalCanvas.toDataURL('image/png');
            a.download = 'QR_Kod_Kamalm_V1.0.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadQRLibAndInit);
    } else {
        loadQRLibAndInit();
    }
})();
</script>
